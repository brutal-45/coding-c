# ============================================================
#  coding-c — CI: compile & smoke-test every C program on push
#  (runs alongside .github/workflows/main.yml)
# ============================================================

name: build-c-programs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: gcc --version

      - name: Compile all programs
        run: make build

      - name: Smoke test every program
        run: make test